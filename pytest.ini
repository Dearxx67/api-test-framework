[pytest]
; 用例收集范围：只从 testcases 目录收集
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 默认运行参数：详细输出 + 双报告（Allure 结果目录 + 单文件 HTML）
; report.html 双击即可在浏览器打开——给未安装 allure 工具的人看报告用
; 注：pytest-html 锁定 3.x，单文件参数为 --self-contained-html（4.x 已移除单文件支持）
addopts = -vs --alluredir=reports/allure-results --clean-alluredir --html=reports/report.html --self-contained-html

; 用例标签（marker）：支持按标签筛选执行，如 pytest -m smoke
markers =
    smoke: 冒烟测试用例（核心链路，每次提测必跑）
    regression: 回归测试用例（版本回归全量跑）
    user: 用户模块
    order: 订单模块
    negative: 异常/边界用例
    mock: Mock 依赖隔离演示用例

; 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
