# ===== 用户模块测试数据 =====
# 数据与脚本分离：新增用例只需在此追加数据，无需改动测试代码

register:
  valid:
    username_prefix: "reg_valid"
    password: "Passw0rd@123"
    expected_status: 200
    expected_code: 0
  duplicate:
    username_prefix: "reg_dup"
    password: "Passw0rd@123"
    expected_status: 400
    expected_detail_contains: "已存在"

login:
  # 未指定的字段（username/password）自动使用 fixture 注册的合法账号
  cases:
    - case: "正确账号密码登录成功"
      expected_status: 200
      expected_code: 0
    - case: "密码错误登录失败"
      password: "wrong_pass_@@"
      expected_status: 401
      expected_detail_contains: "用户名或密码错误"
    - case: "不存在的用户登录失败"
      username: "ghost_user_404"
      password: "whatever"
      expected_status: 401
      expected_detail_contains: "用户名或密码错误"
